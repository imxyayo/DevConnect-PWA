<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConnect - Red Social</title>

    <!-- Configuración para PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">

    <!-- Ícono para pestañas del navegador -->
    <link rel="icon" type="image/png" sizes="192x192" href="./images/icon-192x192.png">
    <link rel="apple-touch-icon" href="./images/icon-192x192.png">

    <!-- Librería idb ligera -->
    <script src="https://cdn.jsdelivr.net/npm/idb@7/build/umd.js"></script>

    <!-- Estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <!-- Header / Top App Bar -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-code"></i> DevConnect</h1>
        <button id="btn-sync" class="hover:text-blue-200">
            <i class="fa-solid fa-rotate"></i>
        </button>
    </header>

    <!-- Área Principal de Contenido (Scrollable) -->
    <main class="flex-1 overflow-y-auto p-4 pb-20" id="feed">
        <!-- Las publicaciones se renderizan dinámicamente aquí -->
    </main>

    <!-- Botón Flotante para nueva publicación (FAB) -->
    <button id="btn-fab" class="fixed bottom-20 right-4 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg text-2xl flex items-center justify-center hover:bg-blue-700 transition">
        <i class="fa-solid fa-pen"></i>
    </button>

    <!-- Modal para Capturar Nuevos Datos -->
    <div id="modal-post" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-5">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-gray-800">Nueva Publicación</h2>
                <button type="button" id="btn-cerrar-modal" class="text-gray-500 hover:text-gray-700 text-2xl leading-none">&times;</button>
            </div>
            <form id="form-post">
                <textarea id="input-contenido" rows="3" required placeholder="Escribe una nota o publicación offline..." class="w-full border border-gray-300 rounded-lg p-3 text-sm mb-4 focus:outline-none focus:border-blue-600"></textarea>
                <div class="flex justify-end gap-2">
                    <button type="button" id="btn-cancelar-modal" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Barra de Navegación Inferior (Bottom Navigation) -->
    <nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full flex justify-around p-3 text-gray-500 pb-safe">
        <a href="#" class="flex flex-col items-center text-blue-600">
            <i class="fa-solid fa-house text-xl mb-1"></i>
            <span class="text-[10px]">Inicio</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-blue-600 transition">
            <i class="fa-solid fa-magnifying-glass text-xl mb-1"></i>
            <span class="text-[10px]">Buscar</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-blue-600 transition">
            <i class="fa-regular fa-bell text-xl mb-1"></i>
            <span class="text-[10px]">Avisos</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-blue-600 transition">
            <i class="fa-regular fa-user text-xl mb-1"></i>
            <span class="text-[10px]">Perfil</span>
        </a>
    </nav>

    <!-- Scripts de la Base de Datos y Lógica -->
    <script src="./js/db.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
